[project]
name = "factory-rag-assistant"
version = "1.3.0"
description = "智慧製造文件 RAG 知識助理"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "pymupdf",
    "sentence-transformers",
    "transformers",
    "qdrant-client",
    "openai",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要真實 Qdrant 與 Embedding API 的整合測試",
    "llm_integration: 需要真實 OpenAI-compatible LLM endpoint 的 smoke test（未設定環境變數時 skip）",
    "external_api: 需要真實外部公開 API（MOJ 全國法規資料庫）的契約漂移偵測；預設不執行，須顯式 -m external_api",
]

[tool.setuptools.packages.find]
include = ["app*"]
