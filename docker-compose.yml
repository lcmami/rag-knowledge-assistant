services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - hf_cache:/root/.cache/huggingface
      - app_storage:/app/storage
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HF_HOME=/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  hf_cache:
  app_storage:
